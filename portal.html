<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papa Jerry's World</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Nunito', sans-serif; background: #F5ECD7; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
.card { background: #FFF8F0; border: 1.5px solid #E0C9B0; border-radius: 24px; padding: 2.5rem 2rem; text-align: center; max-width: 420px; width: 100%; }
.globe { font-size: 3.5rem; margin-bottom: 0.5rem; }
h1 { font-family: 'Fredoka One', cursive; font-size: 2.2rem; color: #7B5C3E; margin-bottom: 0.25rem; }
.subtitle { font-size: 0.95rem; color: #A0856A; margin-bottom: 2rem; }
.btn-grid { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }
.join-btn { width: 100%; padding: 0.9rem 1rem; border-radius: 12px; border: none; font-family: 'Fredoka One', cursive; font-size: 1.3rem; color: #FFF8F0; background: #7B5C3E; cursor: pointer; transition: opacity 0.15s, transform 0.1s; }
.join-btn:hover { opacity: 0.88; transform: scale(1.01); }
.note { font-size: 0.8rem; color: #A0856A; line-height: 1.5; }
</style>
</head>
<body>
<div class="card">
  <div class="globe">🌍</div>
  <h1>Papa Jerry's World</h1>
  <p class="subtitle">A virtual world for everyone</p>
  <div class="btn-grid">
    <button class="join-btn" onclick="joinSession(6081)">Join — Session 1</button>
    <button class="join-btn" onclick="joinSession(8080)">Join — Session 2</button>
  </div>
  <p class="note">Each button opens its own private window. Log in with your avatar name and password.</p>
</div>
<script>
function joinSession(port) {
  var host = window.location.hostname.replace(/-\d+\./, '-' + port + '.');
  window.open('https://' + host + '/vnc_auto.html?autoconnect=true&resize=scale', '_blank');
}
</script>
</body>
</html>
